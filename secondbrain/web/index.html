<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SecondBrain</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='%234f46e5'/><circle cx='16' cy='16' r='5' fill='white'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <span>SecondBrain</span>
      </div>

      <button class="btn btn-primary" id="newChat" type="button">New chat</button>

      <section class="panel">
        <div class="panel-head">
          <h2>Documents</h2>
          <button class="icon-btn" id="refreshDocs" type="button" title="Refresh" aria-label="Refresh documents">↻</button>
        </div>
        <label class="drop" id="drop">
          <input type="file" id="fileInput" accept="application/pdf,.pdf" hidden>
          <span class="drop-title">Upload PDF</span>
          <span class="drop-sub">Click or drop a file here</span>
        </label>
        <div class="upload-status" id="uploadStatus" role="status"></div>
        <ul class="doc-list" id="docList"></ul>
      </section>

      <section class="panel">
        <h2>Session</h2>
        <label class="field">
          <span>User</span>
          <input id="userId" type="text" autocomplete="off" spellcheck="false">
        </label>
        <div class="session-meta">Thread <code id="threadLabel"></code></div>
        <button class="btn" id="endSession" type="button" title="Save what you told me to long-term memory">End session &amp; remember</button>
        <div class="upload-status" id="sessionStatus" role="status"></div>
      </section>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu" id="menuBtn" type="button" aria-label="Toggle sidebar">☰</button>
        <span class="topbar-title">Ask your documents</span>
        <span class="health" id="health" title="API status"></span>
      </header>

      <div class="messages" id="messages" aria-live="polite">
        <div class="empty" id="empty">
          <h1>What do you want to know?</h1>
          <p>Upload a PDF, then ask questions about it. Every answer shows how it was routed, how confident the system is and which pages it came from.</p>
          <div class="suggestions">
            <button type="button" class="chip-btn">Which documents have I uploaded?</button>
            <button type="button" class="chip-btn">Summarize my documents</button>
            <button type="button" class="chip-btn">Generate interview questions from my notes</button>
          </div>
        </div>
      </div>

      <form class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="Ask a question…" aria-label="Message" required></textarea>
        <button class="btn btn-primary send" id="sendBtn" type="submit" aria-label="Send">Send</button>
      </form>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
